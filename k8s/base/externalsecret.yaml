apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cookit-env
  namespace: cookit
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cookit-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Vault key holding the env for this app. Expected keys:
        #   DATABASE_URL, SECRET_KEY, GATEWAY_SHARED_SECRET, CORS_ORIGINS,
        #   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
        #   MINIO_BUCKET, MINIO_REGION,
        #   USE_ALEMBIC_MIGRATIONS, LOG_LEVEL
        #
        # GATEWAY_SHARED_SECRET is optional in the sense that the app starts
        # without it — but the Authentik routes then refuse every request,
        # because that secret is the only thing proving a call arrived through
        # API Get Away rather than straight off the internet. Password sign-in
        # is unaffected either way.
        #
        # The MINIO_* keys are what dish photos are stored under. With storage
        # unreachable, uploads answer 502 and the rest of the app — recipes,
        # filters, the wheel, the markdown export — carries on.
        key: apps/cookit/cookit/env
